<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SugarMe — Admin Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #09090B; --bg-secondary: #121216; --bg-glass: rgba(20, 20, 25, 0.7);
  --accent-gold: #D4AF37; --accent-crimson: #7A1212; --text-primary: #F9FAFB;
  --text-secondary: #A1A1AA; --border-subtle: rgba(255, 255, 255, 0.08);
  --shadow-luxury: 0 20px 40px rgba(0, 0, 0, 0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; }
h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: 400; }

/* Access Denied Screen */
#accessDenied { position: fixed; inset: 0; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 9999; }
#accessDenied h1 { color: var(--accent-crimson); font-size: 2.5rem; }
#accessDenied p { color: var(--text-secondary); }

/* Layout */
.admin-layout { display: flex; min-height: 100vh; }
.admin-sidebar { width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border-subtle); padding: 24px 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; }
.admin-logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; padding: 0 24px 24px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; }
.admin-logo span { color: var(--accent-gold); }
.admin-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }
.admin-nav-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; transition: 0.2s; }
.admin-nav-btn:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
.admin-nav-btn.active { background: rgba(212, 175, 55, 0.08); color: var(--accent-gold); border-left: 3px solid var(--accent-gold); }

.admin-main { margin-left: 260px; flex: 1; padding: 40px; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
.admin-header h1 { font-size: 2rem; }
.admin-header h1 span { color: var(--accent-gold); font-style: italic; }

/* Admin Panels */
.admin-panel { display: none; }
.admin-panel.active { display: block; }

/* Buttons */
.btn-gold { background: var(--accent-gold); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: 0.2s; }
.btn-gold:hover { background: #e5c158; }
.btn-crimson { background: var(--accent-crimson); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: 0.2s; }
.btn-crimson:hover { background: #9a1a1a; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-subtle); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: 0.2s; }
.btn-ghost:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
.btn-danger { background: transparent; color: #f87171; border: 1px solid rgba(239,68,68,0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; }
.btn-danger:hover { background: rgba(239,68,68,0.08); }

/* Tables */
.data-table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); }
.data-table th { background: rgba(255,255,255,0.03); padding: 14px 16px; text-align: left; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); }
.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-primary); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover { background: rgba(255,255,255,0.02); }

/* Character Cards */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.char-admin-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; }
.char-admin-img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1f; }
.char-admin-info { padding: 16px; }
.char-admin-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
.char-admin-info .meta { color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 12px; }
.char-admin-actions { display: flex; gap: 8px; }

/* Forms */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
.form-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; }
.form-input:focus { border-color: var(--accent-gold); }
textarea.form-input { min-height: 80px; resize: vertical; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 32px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; margin: 16px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.modal-header h2 { font-size: 1.5rem; }
.modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }

/* Badges */
.badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.badge-free { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.badge-premium { background: rgba(212,175,55,0.15); color: var(--accent-gold); border: 1px solid rgba(212,175,55,0.3); }
.badge-admin { background: rgba(122,18,18,0.2); color: #f87171; border: 1px solid rgba(122,18,18,0.4); }
.badge-user { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
.badge-blocked { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

.mobile-admin-header { display: none; position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-subtle); padding: 0 20px; align-items: center; justify-content: space-between; z-index: 200; }
.mobile-admin-header .admin-logo { font-size: 1.2rem; margin: 0; border: none; padding: 0; }
.admin-hamburger { background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; padding: 8px; }

.admin-sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; }
.admin-sidebar-overlay.open { display: block; }

@media (max-width: 768px) {
  .mobile-admin-header { display: flex; }
  .admin-sidebar { 
    transform: translateX(-100%); 
    transition: transform 0.3s ease; 
    z-index: 160; 
    padding-top: 80px;
  }
  .admin-sidebar.open { transform: translateX(0); }
  .admin-main { margin-left: 0; padding: 80px 20px 20px; }
  .char-grid { grid-template-columns: 1fr; }
  .data-table { font-size: 0.8rem; }
  .data-table th, .data-table td { padding: 10px 8px; }
}
}
</style>
</head>
<body>

<!-- ACCESS DENIED SCREEN -->
<div id="accessDenied" style="display:none;">
  <h1>Access Denied</h1>
  <p>You do not have permission to view this page.</p>
  <a href="/" class="btn-ghost" style="text-decoration:none; margin-top:10px;">Return to Lounge</a>
</div>

<!-- ADMIN LAYOUT -->
<div class="admin-layout" id="adminLayout" style="display:none;">
  <!-- MOBILE HEADER -->
  <div class="mobile-admin-header">
    <button class="admin-hamburger" onclick="toggleAdminSidebar()">☰</button>
    <div class="admin-logo">Sugar<span>Me</span> Vault</div>
    <button class="admin-hamburger" onclick="doLogout()" style="color:#f87171;">⎋</button>
  </div>
  
  <!-- SIDEBAR OVERLAY (closes sidebar on tap) -->
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay" onclick="toggleAdminSidebar()"></div>
  
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-logo">Sugar<span>Me</span> Vault</div>
    <nav class="admin-nav">
      <button class="admin-nav-btn active" onclick="showPanel('dashboard', this)">⌂ Dashboard</button>
      <button class="admin-nav-btn" onclick="showPanel('characters', this)">✦ Characters</button>
      <button class="admin-nav-btn" onclick="showPanel('users', this)">◉ Users</button>
      <button class="admin-nav-btn" onclick="window.doLogout()" style="margin-top:auto; color:#f87171;">← Log Out</button>
    </nav>
  </aside>

  <main class="admin-main">
    <!-- DASHBOARD PANEL -->
    <div class="admin-panel active" id="panel-dashboard">
      <div class="admin-header">
        <h1>Welcome, <span id="adminName">Admin</span></h1>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:32px;">
        <div style="background:var(--bg-secondary); border:1px solid var(--border-subtle); border-radius:12px; padding:24px;">
          <div style="color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px;">Total Characters</div>
          <div style="font-family:'Playfair Display',serif; font-size:2.5rem; color:var(--accent-gold);" id="statChars">0</div>
        </div>
        <div style="background:var(--bg-secondary); border:1px solid var(--border-subtle); border-radius:12px; padding:24px;">
          <div style="color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px;">Total Users</div>
          <div style="font-family:'Playfair Display',serif; font-size:2.5rem; color:var(--accent-gold);" id="statUsers">0</div>
        </div>
        <div style="background:var(--bg-secondary); border:1px solid var(--border-subtle); border-radius:12px; padding:24px;">
          <div style="color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px;">Your Role</div>
          <div style="font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--accent-gold);" id="statRole">—</div>
        </div>
      </div>
    </div>

    <!-- CHARACTERS PANEL -->
    <div class="admin-panel" id="panel-characters">
      <div class="admin-header">
        <h1>Character <span>Management</span></h1>
        <button class="btn-gold" onclick="openCharModal()">+ Add New Character</button>
      </div>
      <div class="char-grid" id="charGrid"></div>
    </div>

    <!-- USERS PANEL -->
    <div class="admin-panel" id="panel-users">
      <div class="admin-header">
        <h1>User <span>Management</span></h1>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Plan</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- CHARACTER MODAL -->
<div class="modal-overlay" id="charModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="charModalTitle">Add Character</h2>
      <button class="modal-close" onclick="closeCharModal()">✕</button>
    </div>
    <form id="charForm" onsubmit="saveCharacter(event)">
      <input type="hidden" id="charId"/>
      <div class="form-group"><label>Name</label><input type="text" id="charName" class="form-input" required/></div>
      <div class="form-group"><label>Age</label><input type="number" id="charAge" class="form-input" required/></div>
      <div class="form-group"><label>Personality</label>
        <select id="charPersonality" class="form-input" required>
          <option value="Playful">Playful</option>
          <option value="Shy">Shy</option>
          <option value="Confident">Confident</option>
          <option value="Mysterious">Mysterious</option>
          <option value="Sweet">Sweet</option>
        </select>
      </div>
      <div class="form-group"><label>Bio</label><textarea id="charBio" class="form-input" required></textarea></div>
      <div class="form-group"><label>Likes (comma separated)</label><input type="text" id="charLikes" class="form-input" placeholder="Travel, Dancing, Coffee"/></div>
      <div class="form-group"><label>Image URL</label><input type="text" id="charImg" class="form-input" placeholder="/images/... or https://..."/></div>
      <div class="form-group"><label>Video URL (optional)</label><input type="text" id="charVideo" class="form-input"/></div>
      <div class="form-group"><label>Greetings (one per line)</label><textarea id="charGreetings" class="form-input" placeholder="Hey there!&#10;Hi, how are you?"></textarea></div>
      <div class="form-group"><label>
        <input type="checkbox" id="charFree"/> Free Character (available to all users)
      </label></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn-gold">Save Character</button>
        <button type="button" class="btn-ghost" onclick="closeCharModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyDUERWnHurjAPYm9N7P52sXYXLI2Npux54", authDomain:"sugarme-9a37d.firebaseapp.com", projectId:"sugarme-9a37d", storageBucket:"sugarme-9a37d.firebasestorage.app", messagingSenderId:"237083119168", appId:"1:237083119168:web:dded20690c03658a9259a5" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserData = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('accessDenied').style.display = 'flex';
    return;
  }
  
  // Check if user is admin
  const userDoc = await getDoc(doc(db, 'users', user.uid));
  if (!userDoc.exists() || !['admin', 'super_admin'].includes(userDoc.data().role)) {
    document.getElementById('accessDenied').style.display = 'flex';
    return;
  }
  
  currentUserData = { uid: user.uid, ...userDoc.data() };
  document.getElementById('accessDenied').style.display = 'none';
  document.getElementById('adminLayout').style.display = 'flex';
  document.getElementById('adminName').textContent = user.displayName || user.email.split('@')[0];
  document.getElementById('statRole').textContent = currentUserData.role === 'super_admin' ? 'Super Admin' : 'Admin';
  
  await loadDashboardStats();
  await loadCharacters();
  await loadUsers();
});

async function loadDashboardStats() {
  const charsSnap = await getDocs(collection(db, 'characters'));
  const usersSnap = await getDocs(collection(db, 'users'));
  document.getElementById('statChars').textContent = charsSnap.size;
  document.getElementById('statUsers').textContent = usersSnap.size;
}

async function loadCharacters() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '<p style="color:var(--text-secondary);">Loading...</p>';
  const snap = await getDocs(collection(db, 'characters'));
  grid.innerHTML = '';
  snap.forEach(docSnap => {
    const c = { id: docSnap.id, ...docSnap.data() };
    const imgSrc = Array.isArray(c.img) ? c.img[0] : c.img;
    const card = document.createElement('div');
    card.className = 'char-admin-card';
    card.innerHTML = `
      <img class="char-admin-img" src="${imgSrc || ''}" alt="${c.name}"/>
      <div class="char-admin-info">
        <h3>${c.name} <span class="badge ${c.free ? 'badge-free' : 'badge-premium'}">${c.free ? 'Free' : 'Premium'}</span></h3>
        <div class="meta">Age ${c.age} · ${c.personality}</div>
        <div class="char-admin-actions">
          <button class="btn-ghost" onclick='editCharacter(${JSON.stringify(c).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="btn-danger" onclick="deleteCharacter('${c.id}', '${c.name}')">Delete</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

async function loadUsers() {
  const tbody = document.getElementById('usersTableBody');
  tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-secondary);">Loading...</td></tr>';
  const snap = await getDocs(collection(db, 'users'));
  tbody.innerHTML = '';
  snap.forEach(docSnap => {
    const u = { id: docSnap.id, ...docSnap.data() };
    const isSuperAdmin = u.role === 'super_admin';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.name || '—'}</td>
      <td>${u.email || '—'}</td>
      <td><span class="badge ${u.plan === 'free' ? 'badge-user' : 'badge-premium'}">${u.plan || 'free'}</span></td>
      <td><span class="badge ${u.role === 'super_admin' || u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role || 'user'}</span></td>
      <td>${u.blocked ? '<span class="badge badge-blocked">Blocked</span>' : '<span style="color:#4ade80;">Active</span>'}</td>
      <td>
        ${!isSuperAdmin ? `
          <button class="btn-ghost" onclick="toggleAdmin('${u.id}', '${u.role}')">${u.role === 'admin' ? 'Demote' : 'Promote'}</button>
          <button class="btn-ghost" onclick="toggleBlock('${u.id}', ${u.blocked || false})">${u.blocked ? 'Unblock' : 'Block'}</button>
        ` : '<span style="color:var(--text-secondary); font-size:0.8rem;">Owner</span>'}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.showPanel = (panelId, btn) => {
  document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + panelId).classList.add('active');
  btn.classList.add('active');
  // Close sidebar on mobile after clicking
  if (window.innerWidth <= 768) {
    toggleAdminSidebar();
  }
};

window.toggleAdminSidebar = () => {
  document.getElementById('adminSidebar').classList.toggle('open');
  document.getElementById('adminSidebarOverlay').classList.toggle('open');
};

window.openCharModal = (char = null) => {
  document.getElementById('charModal').classList.add('open');
  document.getElementById('charForm').reset();
  if (char) {
    document.getElementById('charModalTitle').textContent = 'Edit Character';
    document.getElementById('charId').value = char.id;
    document.getElementById('charName').value = char.name;
    document.getElementById('charAge').value = char.age;
    document.getElementById('charPersonality').value = char.personality;
    document.getElementById('charBio').value = char.bio;
    document.getElementById('charLikes').value = (char.likes || []).join(', ');
    document.getElementById('charImg').value = Array.isArray(char.img) ? char.img[0] : (char.img || '');
    document.getElementById('charVideo').value = Array.isArray(char.video) ? char.video[0] : (char.video || '');
    document.getElementById('charGreetings').value = (char.greetings || []).join('\n');
    document.getElementById('charFree').checked = char.free || false;
  } else {
    document.getElementById('charModalTitle').textContent = 'Add Character';
  }
};

window.closeCharModal = () => {
  document.getElementById('charModal').classList.remove('open');
};

window.editCharacter = (char) => {
  openCharModal(char);
};

window.saveCharacter = async (e) => {
  e.preventDefault();
  const id = document.getElementById('charId').value || 'char_' + Date.now();
  const charData = {
    id,
    name: document.getElementById('charName').value,
    age: parseInt(document.getElementById('charAge').value),
    personality: document.getElementById('charPersonality').value,
    bio: document.getElementById('charBio').value,
    likes: document.getElementById('charLikes').value.split(',').map(s => s.trim()).filter(s => s),
    img: [document.getElementById('charImg').value],
    video: [document.getElementById('charVideo').value].filter(v => v),
    photos: [],
    greetings: document.getElementById('charGreetings').value.split('\n').map(s => s.trim()).filter(s => s),
    free: document.getElementById('charFree').checked
  };
  await setDoc(doc(db, 'characters', id), charData);
  closeCharModal();
  await loadCharacters();
  await loadDashboardStats();
  alert('Character saved successfully.');
};

window.deleteCharacter = async (id, name) => {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  await deleteDoc(doc(db, 'characters', id));
  await loadCharacters();
  await loadDashboardStats();
};

window.toggleAdmin = async (uid, currentRole) => {
  if (currentUserData.role !== 'super_admin') {
    alert('Only Super Admin can promote/demote users.');
    return;
  }
  const newRole = currentRole === 'admin' ? 'user' : 'admin';
  await setDoc(doc(db, 'users', uid), { role: newRole }, { merge: true });
  await loadUsers();
};

window.toggleBlock = async (uid, currentlyBlocked) => {
  await setDoc(doc(db, 'users', uid), { blocked: !currentlyBlocked }, { merge: true });
  await loadUsers();
};

window.doLogout = async () => {
  await signOut(auth);
  window.location.href = '/';
};
</script>
</body>
</html>
